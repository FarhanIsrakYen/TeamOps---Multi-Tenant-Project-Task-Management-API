openapi: 3.1.0
info:
  title: TeamOps API
  version: 1.0.0
  description: Multi-tenant project and task management API.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
      responses: { '201': { description: Account and token pair } }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate
      responses: { '200': { description: Token pair } }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token
      responses: { '200': { description: Rotated token pair }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh session
      responses: { '204': { description: Session revoked } }
  /me:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Current user } }
  /organizations:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Organization page } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Organization created } }
  /organizations/{organizationId}:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Organization visible to the member } }
    patch:
      security: [{ bearerAuth: [] }]
      summary: Update with an optimistic-lock version
      responses: { '200': { description: Organization updated }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Organization deleted } }
  /organizations/{organizationId}/members:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Membership list } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Member added or role updated } }
  /organizations/{organizationId}/projects:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Project page } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Project created } }
  /organizations/{organizationId}/labels:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Organization labels } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Label created } }
  /organizations/{organizationId}/audit-logs:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Paginated audit log; owner or admin only } }
  /projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Project } }
    patch:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Project updated }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Project deleted } }
  /projects/{projectId}/tasks:
    parameters: [{ $ref: '#/components/parameters/ProjectId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Filtered task page } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Task created } }
  /tasks/{taskId}:
    parameters: [{ $ref: '#/components/parameters/TaskId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Task } }
    patch:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Task updated }, '409': { $ref: '#/components/responses/Conflict' } }
    delete:
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Task deleted } }
  /tasks/{taskId}/comments:
    parameters: [{ $ref: '#/components/parameters/TaskId' }]
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Task comments } }
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Comment created } }
  /tasks/{taskId}/labels:
    parameters: [{ $ref: '#/components/parameters/TaskId' }]
    put:
      security: [{ bearerAuth: [] }]
      responses: { '204': { description: Task labels atomically replaced } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized: { description: Invalid or expired credentials }
    Conflict: { description: Version or uniqueness conflict }
  schemas:
    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 2 }
        password: { type: string, minLength: 12, maxLength: 72, format: password }
