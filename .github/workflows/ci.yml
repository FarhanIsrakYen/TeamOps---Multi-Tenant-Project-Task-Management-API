name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: teamops, POSTGRES_PASSWORD: teamops, POSTGRES_DB: teamops_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamops -d teamops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: gofmt -l . | tee /tmp/gofmt && test ! -s /tmp/gofmt
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -race -tags=integration ./tests/integration
        env:
          TEST_DATABASE_URL: "postgres://teamops:teamops@localhost:5432/teamops_test?sslmode=disable"
          TEST_REDIS_ADDR: "localhost:6379"
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
