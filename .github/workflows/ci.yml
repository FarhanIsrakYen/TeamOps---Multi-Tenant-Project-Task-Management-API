name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  backend_quality:
    name: Backend / format, vet, static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: --timeout=5m

  backend_unit:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run unit tests
        run: go test -count=1 ./...

  backend_race:
    name: Backend / race tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  backend_integration:
    name: Backend / PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teamops
          POSTGRES_PASSWORD: teamops
          POSTGRES_DB: teamops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamops -d teamops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run integration tests with race detection
        env:
          CGO_ENABLED: "1"
          TEST_DATABASE_URL: postgres://teamops:teamops@localhost:5432/teamops_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -race -count=1 -tags=integration ./tests/integration

  frontend:
    name: Frontend / quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build production bundle
        run: npm run build

  docker_build:
    name: Docker / ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          target: production
          push: false
          tags: teamops-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  quality_gate:
    name: CI / required quality gate
    if: always()
    needs:
      - backend_quality
      - backend_unit
      - backend_race
      - backend_integration
      - frontend
      - docker_build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality gate to pass
        env:
          BACKEND_QUALITY: ${{ needs.backend_quality.result }}
          BACKEND_UNIT: ${{ needs.backend_unit.result }}
          BACKEND_RACE: ${{ needs.backend_race.result }}
          BACKEND_INTEGRATION: ${{ needs.backend_integration.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER_BUILD: ${{ needs.docker_build.result }}
        shell: bash
        run: |
          for result in \
            "$BACKEND_QUALITY" \
            "$BACKEND_UNIT" \
            "$BACKEND_RACE" \
            "$BACKEND_INTEGRATION" \
            "$FRONTEND" \
            "$DOCKER_BUILD"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed (result: $result)."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
