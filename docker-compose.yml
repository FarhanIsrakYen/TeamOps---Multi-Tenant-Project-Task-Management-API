name: teamops
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamops}
      POSTGRES_USER: ${POSTGRES_USER:-teamops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamops}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: migrate/migrate:v4.18.2
    volumes: ["./backend/migrations:/migrations:ro"]
    entrypoint: ["/migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-teamops}:${POSTGRES_PASSWORD:-teamops}@postgres:5432/${POSTGRES_DB:-teamops}?sslmode=disable"]
    command: ["up"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  backend:
    build:
      context: ./backend
      target: production
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-teamops}:${POSTGRES_PASSWORD:-teamops}@postgres:5432/${POSTGRES_DB:-teamops}?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me-32-bytes}
      JWT_ISSUER: ${JWT_ISSUER:-teamops-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-teamops-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      ORGANIZATION_CACHE_TTL: ${ORGANIZATION_CACHE_TTL:-5m}
      PROJECT_CACHE_TTL: ${PROJECT_CACHE_TTL:-5m}
      MEMBERSHIP_CACHE_TTL: ${MEMBERSHIP_CACHE_TTL:-30s}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-30}
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-10}
      LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT:-5}
      LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-15m}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-1048576}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      JOB_QUEUE_SIZE: ${JOB_QUEUE_SIZE:-1024}
      JOB_WORKERS: ${JOB_WORKERS:-4}
      JOB_MAX_RETRIES: ${JOB_MAX_RETRIES:-3}
      JOB_INITIAL_BACKOFF: ${JOB_INITIAL_BACKOFF:-100ms}
      JOB_MAX_BACKOFF: ${JOB_MAX_BACKOFF:-5s}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-10s}
      STALE_TASK_AFTER: ${STALE_TASK_AFTER:-72h}
      STALE_TASK_SCAN_INTERVAL: ${STALE_TASK_SCAN_INTERVAL:-15m}
      PROJECT_STATISTICS_REFRESH_INTERVAL: ${PROJECT_STATISTICS_REFRESH_INTERVAL:-5m}
      SESSION_CLEANUP_INTERVAL: ${SESSION_CLEANUP_INTERVAL:-1h}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-teamops-api}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${FRONTEND_BUILD_API_URL:-/api/v1}
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api/v1}
    ports: ["5173:8080"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
