name: teamops
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamops}
      POSTGRES_USER: ${POSTGRES_USER:-teamops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamops}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: migrate/migrate:v4.18.2
    volumes: ["./backend/migrations:/migrations:ro"]
    entrypoint: ["/migrate", "-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-teamops}:${POSTGRES_PASSWORD:-teamops}@postgres:5432/${POSTGRES_DB:-teamops}?sslmode=disable"]
    command: ["up"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: ./backend
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-teamops}:${POSTGRES_PASSWORD:-teamops}@postgres:5432/${POSTGRES_DB:-teamops}?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me-32-bytes}
      JWT_ISSUER: ${JWT_ISSUER:-teamops-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-teamops-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8080/api/v1 }
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
